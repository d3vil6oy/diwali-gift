<html lang="en">
<head>

<style>
  :root { --gold:#f4c25b; --cream:#fff4e0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:radial-gradient(ellipse at top,#2b1745 0%,#140b24 55%,#08040f 100%); color:var(--cream);
         font-family:Poppins,system-ui,sans-serif; min-height:100vh; }
  .page { max-width:1120px; margin:0 auto; padding:22px 14px 48px; }
  header { text-align:center; margin-bottom:14px; }
  .eyebrow { font-size:.78rem; letter-spacing:.28em; text-transform:uppercase; color:#e9b96a; opacity:.85; }
  h1 { font-family:"Cormorant Garamond",Georgia,serif; font-weight:600; font-size:clamp(2rem,5.2vw,3.2rem);
       color:#ffe2a6; text-shadow:0 0 22px rgba(255,190,90,.35); line-height:1.1; margin-top:4px; }
  h1 span { color:#ff9fbd; }

  #stage { position:relative; width:100%; aspect-ratio:12/7; border-radius:22px; overflow:hidden; background:#0d0717;
           box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(244,194,91,.25); }
  @media (max-width:720px) { #stage { aspect-ratio:1/1.08; border-radius:18px; } }
  #scene { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:manipulation;
           -webkit-tap-highlight-color:transparent; }

  #intro { position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center;
           gap:14px; text-align:center; padding:20px;
           background:radial-gradient(ellipse at center,rgba(46,22,66,.86),rgba(8,4,15,.96)); transition:opacity 1s; }
  #intro.gone { opacity:0; pointer-events:none; }
  #intro .big { font-family:"Cormorant Garamond",Georgia,serif; font-size:clamp(1.8rem,5vw,3rem); color:#ffe2a6; line-height:1.15; }
  #intro .big span { color:#ff9fbd; }
  #intro .small { opacity:.7; font-size:.88rem; }
  .diya-ico { font-size:2.2rem; filter:drop-shadow(0 0 12px rgba(255,180,80,.8)); }

  .btn { font:inherit; font-weight:600; font-size:1rem; border:none; border-radius:999px; padding:13px 28px; cursor:pointer;
         color:#2a1405; background:linear-gradient(180deg,#ffe29a,#f2b84b); box-shadow:0 8px 24px rgba(242,184,75,.35);
         transition:transform .15s; }
  .btn:hover { transform:translateY(-2px); }
  .btn.ghost { background:transparent; color:#ffe2a6; box-shadow:none; border:1px solid rgba(255,226,166,.45);
               padding:10px 20px; font-size:.92rem; }

  #caption { text-align:center; font-family:"Cormorant Garamond",Georgia,serif; font-style:italic;
             font-size:clamp(1.15rem,2.6vw,1.5rem); line-height:1.35; color:#fff1d6; min-height:2.8em;
             margin:16px auto 0; max-width:760px; transition:opacity .45s; }
  #caption.hide { opacity:0; }

  .controls { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:center; margin-top:10px; }
  #np { max-width:460px; margin:0 auto; max-height:0; overflow:hidden; opacity:0;
        transition:max-height .9s ease, opacity .9s ease, margin .9s ease; }
  #np.show { max-height:440px; opacity:1; margin-top:18px; }
  .np-inner { padding:12px 12px 14px; border-radius:18px; background:linear-gradient(180deg,#3a1f10,#22110a);
              border:1px solid rgba(244,194,91,.45); box-shadow:0 12px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,220,150,.15); }
  .np-label { display:flex; align-items:center; justify-content:center; gap:8px; font-size:.7rem; letter-spacing:.2em;
              text-transform:uppercase; color:#e9b96a; }
  .np-dot { width:8px; height:8px; border-radius:50%; background:#ff6b6b; box-shadow:0 0 8px #ff6b6b; }
  .np-title { font-family:"Cormorant Garamond",Georgia,serif; font-size:1.35rem; color:#ffe2a6; text-align:center; margin:2px 0 10px; }
  .np-title span { font-size:1rem; opacity:.75; }
  .np-frame { position:relative; width:100%; aspect-ratio:16/9; min-height:200px; border-radius:10px; overflow:hidden;
              background:#000; border:3px solid #c9973f; }
  .np-frame iframe, .np-frame > div { position:absolute; inset:0; width:100%; height:100%; border:0; }

  #letter { display:none; margin:28px auto 0; max-width:720px; padding:30px 26px 26px; border-radius:22px;
            background:linear-gradient(180deg,rgba(255,236,200,.10),rgba(255,236,200,.04));
            border:1px solid rgba(244,194,91,.4); box-shadow:0 14px 40px rgba(0,0,0,.4); }
  #letter.show { display:block; animation:rise .9s ease-out; }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  #letter h2 { font-family:"Cormorant Garamond",Georgia,serif; font-size:2rem; color:#ffe2a6; text-align:center; margin-bottom:12px; }
  #letterText { font-family:"Cormorant Garamond",Georgia,serif; font-size:1.32rem; line-height:1.65; color:#fff1da;
                white-space:pre-line; min-height:6em; }
  #sign { margin-top:16px; text-align:right; font-family:"Cormorant Garamond",Georgia,serif; font-style:italic;
          font-size:1.25rem; color:var(--gold); opacity:0; transition:opacity 1s; }
  footer { text-align:center; margin-top:26px; font-size:.78rem; opacity:.4; }

  .pulse { animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.25; } 50% { opacity:.95; } }
  .clickable { cursor:pointer; }
</style>
</head>
<body>
<div class="page">

    <h1>Happy Diwali, <span id="nameH">Abhiii</span></h1>

  const os = [130.81, 196.0, 261.63].map((fr, i) => { const o = AC.createOscillator(); o.type = "sawtooth"; o.frequency.value = fr; o.detune.value = (i - 1) * 4; o.connect(lp); o.start(); return o; });
  drone = { g, os };
}
function droneStop() {
  if (!drone) return;
  const { g, os } = drone, t = AC.currentTime;
  g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + .3);
  os.forEach(o => o.stop(t + .35)); drone = null;
}
function synthStart() {
  initAudio(); if (!AC) return false;
  const t = AC.currentTime;
  musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(.9, t + .4);
  droneStart(); nextT = t + .08; clearInterval(seqTimer); seqTimer = setInterval(tick, 25); tick();
  return true;
}
function synthStop() {
  clearInterval(seqTimer); seqTimer = null; if (!AC) return;
  const t = AC.currentTime;
  musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(0, t + .25);
  droneStop();
}
function sfxChime() {
  if (!AC || AC.state !== "running") return;
  const t = AC.currentTime;
  [1318.5, 1975.5, 2637].forEach((fr, i) => {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.value = fr;
    env(g, t + i * .04, .09 / (i + 1), t + i * .04 + 1.4); o.connect(g); g.connect(sfxBus); o.start(t + i * .04); o.stop(t + 1.6);
  });
}
function sfxPop() { if (AC && AC.state === "running") noise(AC.currentTime, "bandpass", 900 + Math.random() * 900, .22, .5, sfxBus); }

/* ================= Story state ================= */
let state = "intro", stateT = 0, playing = false, everPlayed = false;
let h = 0, hBonus = 0, cloudGone = false, cloudOp = 1, cloudPuff = 0;
let danceClock = 0, reactT = 0, litCount = 0, walkFrom = { x: gx, y: gy };
let cur = { ...SAD }, recordAng = 0, armAng = -28, camX = 430, darkOp = .42, noteT = 0, fwT = 0, petalT = 0;
const said = new Set();
const once = (k, fn) => { if (!said.has(k)) { said.add(k); fn(); } };
const WALK_DUR = 5.2;

function setState(s) {
  state = s; stateT = 0;
  if (s === "toDoor") walkFrom = { x: gx, y: gy };
  if (s === "finale") { $("replayBtn").hidden = false; narrate(N.finale); }
}

let capTimer = null;
function narrate(txt) {
  const c = $("caption"); c.classList.add("hide"); clearTimeout(capTimer);
  capTimer = setTimeout(() => { c.textContent = txt; c.classList.remove("hide"); }, 380);
}

/* ---------- Music: the official video on YouTube; a gentle tune if YouTube can't load ---------- */
const npBox = $("np");
function ytIdFrom(u) {
  const m = String(u).match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : (/^[\w-]{11}$/.test(u) ? u : null);
}
const YT_ID = ytIdFrom(YOUTUBE_URL);
let yt = null, ytReady = false, ytFailed = !YT_ID, wantPlay = false, ytEnded = false, watchdog = null;

function setPlaying(v) { playing = v; if (v) everPlayed = true; updatePlayBtn(); }
function updatePlayBtn() { $("playBtn").textContent = playing ? "⏸ Pause music" : "▶ Play music"; }

function startStory(msg) {
  if (state === "sad") { setState("listening"); narrate(msg); }
}

function synthPlay(msg) {
  const ok = synthStart();
  setPlaying(true);
  if (state === "sad") { setState("listening"); }
  narrate(ok ? (msg || N.playS) : "Sound isn't available here, but the story goes on ✨");
}

function ytFail(reason) {
  if (ytFailed) return;
  if (reason === "timeout" && ytReady) return;
  ytFailed = true;
  npBox.classList.remove("show");
  clearTimeout(watchdog);
  if (wantPlay) { wantPlay = false; synthPlay("The song couldn't load here, so here's a gentle tune instead ♪"); }
}

if (YT_ID) {
  window.onYouTubeIframeAPIReady = () => {
    try {
      yt = new YT.Player("ytPlayer", {
        videoId: YT_ID,
        playerVars: { start: SONG_START, playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onReady: () => { ytReady = true; if (wantPlay) ytPlay(); },
          onStateChange: e => ytState(e.data),
          onError: () => ytFail("error")
        }
      });
    } catch (err) { ytFail("error"); }
  };
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => ytFail("blocked");
  document.head.appendChild(s);
  setTimeout(() => ytFail("timeout"), 20000);
}

function ytPlay() {
  wantPlay = true;
  npBox.classList.add("show");
  if (!ytReady) { narrate("Winding up the gramophone… ♪"); return; }
  try {
    if (ytEnded) { yt.seekTo(SONG_START, true); ytEnded = false; }
    yt.playVideo();
  } catch (e) { ytFail("error"); return; }
  clearTimeout(watchdog);
  // Some phones (mostly iPhones) only start a video when it is tapped directly
  watchdog = setTimeout(() => {
    if (wantPlay && !playing) {
      narrate("Tap ▶ on the little player below to start the song 🎵");
      npBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }, 3500);
}

function ytState(s) {
  if (s === 1) {                       // playing (from the gramophone or the player's own button)
    wantPlay = false; clearTimeout(watchdog);
    npBox.classList.add("show");
    const resumed = everPlayed && state !== "sad";
    setPlaying(true);
    startStory(N.playF);
    if (resumed && (state === "listening" || state === "dancing")) narrate("The music plays on… ♪");
  } else if (s === 2) {                // paused
    if (playing) { setPlaying(false); if (state === "listening" || state === "dancing") narrate(N.paused); }
  } else if (s === 0) {                // song finished
    ytEnded = true; setPlaying(false);
    if (["listening", "rising", "dancing"].includes(state)) { setState("toDoor"); narrate(N.toDoor); }
  }
}

function togglePlay() {
  if (state === "intro") return;
  initAudio();
  if (playing || wantPlay) { pauseMusic(); return; }
  if (!ytFailed) ytPlay(); else synthPlay();
}
function pauseMusic() {
  wantPlay = false; clearTimeout(watchdog);
  if (!ytFailed && ytReady) {
    try { yt.pauseVideo(); } catch (e) {}
    if (!playing) updatePlayBtn();
  } else {
    synthStop(); setPlaying(false);
    if (state === "listening" || state === "dancing") narrate(N.paused);
  }
}
$("gramo").addEventListener("click", togglePlay);
$("playBtn").addEventListener("click", togglePlay);
$("replayBtn").addEventListener("click", () => location.reload());
$("cloud").addEventListener("click", () => {
  if (cloudGone || state === "intro") return;
  cloudGone = true; cloudPuff = .001; hBonus = .08; narrate(N.cloud); sfxChime();
});

function lightDiya(d) {
  if (state !== "atDoor") { if (state !== "finale" && state !== "intro") narrate(N.notYet); return; }
  if (d.lit) return;
  d.lit = true; d.litT = 0; litCount++; reactT = .7; sfxChime();
  const left = 5 - litCount;
  if (left > 0) narrate(left === 1 ? "Just one more… 🪔" : `${left} more to go… 🪔`);
  else setTimeout(() => setState("finale"), 900);
}

$("openBtn").addEventListener("click", () => {
  initAudio();
  $("intro").classList.add("gone");
  setState("sad"); narrate(N.intro);
  setTimeout(() => { if (!everPlayed && !wantPlay && state === "sad") narrate(N.hint); }, 5200);
});

/* ================= Effects ================= */
const notes = [], sparks = [], petals = [];
function spawnNote() {
  const t = el("text", { x: 325, y: 265, "font-size": 18 + Math.random() * 10, fill: "#ffe08a", "font-family": "serif" }, $("notes"));
  t.textContent = Math.random() < .5 ? "♪" : "♫";
  notes.push({ el: t, x: 322, y: 262, vx: 40 + Math.random() * 40, vy: -18 - Math.random() * 20, life: 0, ph: Math.random() * 6 });
}
function spawnFirework() {
  const cx = 885 + Math.random() * 130, cy = 195 + Math.random() * 130, col = ["#ffd36b", "#ff6f9a", "#8fe3ff", "#b6ff8f", "#ffffff"][Math.floor(Math.random() * 5)];
  for (let i = 0; i < 22; i++) {
    const a = i / 22 * Math.PI * 2, sp = 35 + Math.random() * 25;
    sparks.push({ el: el("circle", { r: 1.8, fill: col }, $("skyFx")), x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1 });
  }
  sfxPop();
}
function spawnPetal(x0, x1) {
  const p = el("ellipse", { rx: 4, ry: 2.4, fill: ["#ff9f1c", "#ffc21a", "#ff6f9a", "#fff3c0"][Math.floor(Math.random() * 4)] }, $("petals"));
  petals.push({ el: p, x: x0 + Math.random() * (x1 - x0), y: -10, vx: -10 + Math.random() * 20, vy: 50 + Math.random() * 40, rot: Math.random() * 360, vr: -120 + Math.random() * 240, ph: Math.random() * 6 });
}
let letterShown = false;
function showLetter() {
  if (letterShown) return; letterShown = true;
  const box = $("letter"); box.classList.add("show");
  setTimeout(() => box.scrollIntoView({ behavior: "smooth", block: "center" }), 300);
  const out = $("letterText"); let i = 0;
  const type = () => {
    out.textContent = LETTER.slice(0, i++);
    if (i <= LETTER.length) setTimeout(type, LETTER[i - 2] === "\n" ? 260 : 26);
    else { $("sign").textContent = FROM ? `— ${FROM}` : "— with love"; $("sign").style.opacity = 1; }
  };
  type();
}

/* ================= Main loop ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  const advance = (state === "listening" || state === "dancing") ? playing : state !== "intro";
  if (advance) stateT += dt;
  percOn = ["dancing", "toDoor", "atDoor", "finale"].includes(state);

  let target, spin = 0;
  switch (state) {
    case "intro":
    case "sad":
      target = { ...SAD, b: Math.sin(T * 1.4) * 1.2, tilt: -7 + Math.sin(T * .7) * 1.5 };
      h = lerp(h, hBonus, clamp(dt * 1.5));
      break;
    case "listening": {
      const beat = T / BEAT, on = playing ? 1 : 0;
      target = { ...LISTEN, tilt: Math.sin(beat * Math.PI) * 4 * on, fR: Math.max(0, Math.sin(beat * Math.PI * 2)) * 5 * on, b: -Math.abs(Math.sin(beat * Math.PI)) * 1.5 * on };
      h = Math.max(h, Math.min(.38, hBonus + stateT / 7 * .38));
      if (stateT > 3.5) once("listen", () => narrate(N.listen));
      if (stateT >= 8) { setState("rising"); narrate(N.rise); }
      break;
    }
    case "rising": {
      target = lerpPose(LISTEN, { ...STAND, aL: 25, eL: 20, aR: 25, eR: 20 }, smooth(clamp(stateT / 1.6)));
      h = Math.max(h, .4);
      if (stateT >= 1.6) { setState("dancing"); narrate(N.dance); }
      break;
    }
    case "dancing": {
      if (playing) danceClock += dt;
      danceW = lerp(danceW, playing ? 1 : 0, clamp(dt * 4));
      const d = kfPose(DANCE, danceClock / BEAT, true);
      target = lerpPose({ ...STAND, b: Math.sin(T * 2), hs: Math.sin(T * 1.3) * 2 }, d.pose, danceW);
      spin = danceW > .5 ? d.spin : 0;
      h = Math.max(h, .4 + .6 * clamp(stateT / 10));
      if (stateT > 9) once("smile", () => narrate(N.smile));
      if (stateT > 18) once("lighter", () => narrate(N.lighter));
      if (stateT >= DANCE_SECONDS) { setState("toDoor"); narrate(N.toDoor); }
      break;
    }
    case "toDoor": {
      const p = clamp(stateT / WALK_DUR), e = smooth(p), ph = stateT * Math.PI * 2 * 1.4;
      gx = lerp(walkFrom.x, DOORSPOT.x, e); gy = lerp(walkFrom.y, DOORSPOT.y, e);
      danceW = lerp(danceW, .6, clamp(dt * 3));
      target = { ...STAND, aL: 30, eL: 14, aR: 30, eR: 14, b: -Math.abs(Math.sin(ph)) * 3, fL: Math.max(0, Math.sin(ph)) * 7, fR: Math.max(0, -Math.sin(ph)) * 7, hs: Math.sin(ph) * 5, tilt: Math.sin(ph) * 3, flare: .1 };
      if (p > .35 && p < .62) { const q = (p - .35) / .27; spin = smooth(q); target.aL = target.aR = 95; target.eL = target.eR = 5; target.flare = .1 + .7 * Math.sin(Math.PI * q); }
      h = 1;
      if (p >= 1) { setState("atDoor"); narrate(N.atDoor); }
      break;
    }
    case "atDoor": {
      danceW = lerp(danceW, .4, clamp(dt * 3));
      target = { ...NAMASTE, hs: Math.sin(T * 1.5) * 3, tilt: 4 + Math.sin(T * 1.2) * 3, b: Math.sin(T * 2) };
      if (reactT > 0) { reactT -= dt; const w = Math.sin(Math.PI * clamp(1 - reactT / .7)); target = lerpPose(target, { ...STAND, aL: 155, eL: -30, aR: 155, eR: -30, b: -10, flare: .25 }, w); }
      h = 1;
      break;
    }
    case "finale": {
      danceW = lerp(danceW, 1, clamp(dt * 3));
      const beats = stateT / BEAT;
      if (beats < FINALE_KF.length) { const d = kfPose(FINALE_KF, beats, false); target = d.pose; spin = d.spin; }
      else target = { ...NAMASTE, hs: Math.sin(T * 1.5) * 4, tilt: 4 + Math.sin(T * 1.2) * 4, b: Math.sin(T * 2) * 1.5 };
      h = 1;
      fwT -= dt;
      if (fwT <= 0) { spawnFirework(); fwT = stateT < 12 ? .45 + Math.random() * .5 : 1.8 + Math.random() * 1.5; }
      if (stateT < 7) { petalT -= dt; if (petalT <= 0) { const vw = viewW(); spawnPetal(camX - vw / 2, camX + vw / 2); petalT = .06; } }
      if (stateT > 3.2) showLetter();
      break;
    }
  }

  cur = lerpPose(cur, target, 1 - Math.exp(-dt * 9));
  let sx = Math.cos(spin * Math.PI * 2);
  sx = Math.sign(sx || 1) * Math.max(.1, Math.abs(sx));
  const dancingish = ["dancing", "toDoor", "atDoor", "finale"].includes(state);
  const head = renderGirl(cur, sx);
  renderFace(h, dt, dancingish);
  $("spotGirl").setAttribute("cx", f1(gx)); $("spotGirl").setAttribute("cy", f1(gy - 120));

  // cloud
  const cloudTarget = (state === "intro" || state === "sad") && !cloudGone ? 1 : 0;
  cloudOp = lerp(cloudOp, cloudTarget, clamp(dt * (cloudPuff ? 6 : 2)));
  if (cloudPuff) cloudPuff += dt;
  const cs = head.sc * (1 + cloudPuff * 1.5);
  $("cloud").setAttribute("transform", `translate(${f1(head.headX + 8)} ${f1(head.headY - 72 * head.sc)}) scale(${cs.toFixed(3)})`);
  $("cloud").setAttribute("opacity", cloudOp.toFixed(2));
  $("cloud").style.pointerEvents = cloudOp > .3 ? "auto" : "none";
  dropEls.forEach((d, i) => { const o = (T * 42 + i * 9) % 22; d.setAttribute("transform", `translate(0 ${f1(o)})`); d.setAttribute("opacity", f1(1 - o / 22)); });

  // gramophone
  if (playing) recordAng = (recordAng + dt * 200) % 360;
  $("recordSpin").setAttribute("transform", `rotate(${f1(recordAng)})`);
  armAng = lerp(armAng, playing ? 0 : -28, clamp(dt * 4));
  $("toneArm").setAttribute("transform", `translate(336 365) rotate(${f1(armAng)})`);
  $("hint").setAttribute("opacity", state === "sad" && !everPlayed ? 1 : 0);
  if (playing) { noteT -= dt; if (noteT <= 0) { spawnNote(); noteT = .55; } }
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i]; n.life += dt; n.x += n.vx * dt; n.y += n.vy * dt + Math.sin(T * 3 + n.ph) * .4;
    n.el.setAttribute("x", f1(n.x)); n.el.setAttribute("y", f1(n.y));
    n.el.setAttribute("opacity", f1(Math.min(1, n.life * 3) * Math.max(0, 1 - n.life / 3.2)));
    if (n.life > 3.2) { n.el.remove(); notes.splice(i, 1); }
  }

  // diyas
  diyas.forEach((d, i) => {
    d.hint.setAttribute("opacity", state === "atDoor" && !d.lit ? 1 : 0);
    if (!d.lit) return;
    d.litT += dt;
    const s = smooth(clamp(d.litT * 2.5)), fy = 1 + .09 * Math.sin(T * 14 + i) + .05 * Math.sin(T * 23 + i * 2);
    d.flame.setAttribute("transform", `translate(25 -11) scale(${(s * .95).toFixed(3)} ${(s * fy).toFixed(3)}) rotate(${f1(Math.sin(T * 9 + i) * 4)})`);
    d.glow.setAttribute("opacity", (s * .9).toFixed(2));
  });

  // room light
  darkOp = lerp(darkOp, state === "finale" ? .05 : .42 - .16 * h, clamp(dt * 1.2));
  $("dark").setAttribute("opacity", darkOp.toFixed(3));
  const sg = state === "finale" ? .85 : .22 + .25 * h;
  $("sg1").setAttribute("opacity", sg.toFixed(2)); $("sg2").setAttribute("opacity", sg.toFixed(2));
  $("doorSpill").setAttribute("opacity", (.6 + .4 * litCount / 5).toFixed(2));
  const kl = state === "finale" ? clamp(stateT / 1.5) : 0;
  $("kandilGlow").setAttribute("opacity", (kl * (.75 + .1 * Math.sin(T * 3))).toFixed(2));
  $("kandilStar").setAttribute("fill", kl > .5 ? "#ff7a2a" : "#7a2f17");
  $("vFlames").setAttribute("opacity", kl.toFixed(2));
  if (kl > 0) vFlameEls.forEach((f, i) => f.setAttribute("transform",
    `${f.dataset.base} scale(${(.95 + .05 * Math.sin(T * 11 + i)).toFixed(3)} ${(1 + .1 * Math.sin(T * 14 + i * 2)).toFixed(3)})`));
  $("kandilCore").setAttribute("opacity", (.2 + kl * .8).toFixed(2));

  starEls.forEach(s => s.c.setAttribute("opacity", (.45 + .55 * Math.abs(Math.sin(T * s.sp + s.ph))).toFixed(2)));
  cityDots.forEach(d => d.c.setAttribute("opacity", (.4 + .6 * Math.abs(Math.sin(T * 2 + d.ph))).toFixed(2)));

  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i]; p.life -= dt * .9; p.vy += 30 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .985;
    p.el.setAttribute("cx", f1(p.x)); p.el.setAttribute("cy", f1(p.y)); p.el.setAttribute("opacity", Math.max(0, p.life).toFixed(2));
    if (p.life <= 0) { p.el.remove(); sparks.splice(i, 1); }
  }
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i]; p.y += p.vy * dt; p.x += (p.vx + Math.sin(T * 2 + p.ph) * 20) * dt; p.rot += p.vr * dt;
    p.el.setAttribute("transform", `translate(${f1(p.x)} ${f1(p.y)}) rotate(${f1(p.rot)})`);
    if (p.y > 720) { p.el.remove(); petals.splice(i, 1); }
  }

  // camera: on narrow screens, follow the story
  const vw = viewW();
  let cx = 430;
  if (state === "toDoor") cx = gx + 60;
  if (state === "atDoor" || state === "finale") cx = 1200;
  cx = clamp(cx, vw / 2, 1200 - vw / 2);
  camX = lerp(camX, cx, clamp(dt * 2.2));
  camX = clamp(camX, vw / 2, 1200 - vw / 2);
  $("scene").setAttribute("viewBox", `${f1(camX - vw / 2)} 0 ${f1(vw)} 700`);

  requestAnimationFrame(frame);
}
const stage = $("stage");
function viewW() { const a = stage.clientWidth / Math.max(1, stage.clientHeight); return clamp(700 * a, 560, 1200); }
requestAnimationFrame(frame);

// Small hook used for testing each stage of the story
window.__scene = {
  go(s, extra) {
    $("intro").classList.add("gone");
    if (s === "dancing" || s === "listening") { playing = true; everPlayed = true; }
    if (s === "atDoor" || s === "finale") { gx = DOORSPOT.x; gy = DOORSPOT.y; h = 1; }
    if (s === "dancing") h = .7;
    if (s === "finale") diyas.forEach(d => { d.lit = true; d.litT = 1; });
    setState(s); if (extra) danceClock = extra;
  },
  get state() { return state; }
};
})();
</script>
